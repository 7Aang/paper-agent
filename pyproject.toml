[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-agent-local"
version = "0.2.0"
description = "Evidence-first paper research with bounded multi-agent orchestration"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "truststore>=0.10,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
retrieval = ["numpy>=1.26,<3", "sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]

[project.scripts]
paper-agent = "paper_agent.cli:main"

[tool.setuptools.package-data]
paper_agent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: requires network or external model", "slow: longer-running benchmark"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
